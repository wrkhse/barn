[package]
name = "barn"
description = "The only daemon on a wrkhse machine: stalls, listeners and the guard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["cli"]
cli = ["dep:clap"]
test-fixtures = ["dep:barn-exec", "dep:barn-luau-stall"]

[dependencies]
barn-exec = { path = "../barn-exec", optional = true }
barn-luau-stall = { path = "../barn-luau-stall", optional = true }
barn-stall = { path = "../barn-stall" }
clap = { workspace = true, optional = true }
nono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[[bin]]
name = "barn"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "stall_drain_fixture"
path = "examples/stall_drain_fixture.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "barn-exec"
path = "tests/fixtures/barn_exec.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "barn-luau-stall"
path = "tests/fixtures/barn_luau_stall.rs"
required-features = ["test-fixtures"]

[lints]
workspace = true
