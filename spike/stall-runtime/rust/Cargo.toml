[package]
name = "stall-b"
version = "0.1.0"
edition = "2021"

# The spike is its own workspace on purpose and is never a member of barn's:
# it is throwaway code, so barn's workspace and its gates do not own it.
[workspace]

[features]
# One JavaScript engine per binary, chosen when it is built, so each binary's size and
# timings stand on their own: rquickjs is candidate B's realm, djs gives candidate C the
# same stall with a different interpreter. Building with neither, or with both, is a
# compile error (src/lib.rs).
default = ["engine-rquickjs"]
engine-rquickjs = ["dep:rquickjs"]
engine-djs = ["dep:djs-embed"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rquickjs = { version = "0.14", optional = true }
futures-util = "0.3"
# djs-embed is publish = false, so it can only come from the repository, never from
# crates.io. The pin is a commit, 0e58f62c80252fc3f4156ab7a3744746434ed860 ("docs: mark
# the index and introduction as experimental"), not a tag or a branch, because djs-embed
# is 0.x and a moving ref could change its API under the spike.
djs-embed = { git = "https://github.com/earendil-works/djs", rev = "0e58f62c80252fc3f4156ab7a3744746434ed860", optional = true }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
